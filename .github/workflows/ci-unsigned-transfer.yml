name: Transfer tested APK for original-key signing

on:
  workflow_dispatch:
  push:
    branches: ["feature/asterion-unified-downloads-20261030"]
    paths: [".github/workflows/ci-unsigned-transfer.yml"]

permissions:
  contents: write
  actions: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve verified Android CI build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41201901806 -n Asterion-Downloader-v1.2.1-Preview-APK -D "$RUNNER_TEMP/apk"
          test -s "$RUNNER_TEMP/apk/app-preview.apk"
          cp "$RUNNER_TEMP/apk/app-preview.apk" "$RUNNER_TEMP/Asterion-Downloader-v1.3.14-CI-UNSIGNED.apk"
      - name: Stage unsigned CI artifact on dedicated transfer branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-unsigned-transfer
          git rm -rf . || true
          cp "$RUNNER_TEMP/Asterion-Downloader-v1.3.14-CI-UNSIGNED.apk" .
          git add Asterion-Downloader-v1.3.14-CI-UNSIGNED.apk
          git commit -m "Stage verified CI v1.3.14 APK for local certificate signing"
          git push -f origin HEAD:refs/heads/artifacts/asterion-ci-unsigned
