name: Asterion Downloader VideoFlow Fusion CI
on:
  push:
    branches: [feature/asterion-downloader-videoflow-fusion-20261030]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fusion-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests and build preview APK
        run: gradle :app:testDebugUnitTest :app:testPreviewUnitTest :app:assemblePreview --no-daemon --stacktrace
      - name: Verify installable APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/preview/app-preview.apk
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "$BUILD_TOOLS/apksigner" verify "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep "com.azrael.pixivdumpsync.nocturne"
      - uses: actions/upload-artifact@v4
        with:
          name: Asterion-Downloader-v1.2.0-VideoFlow-Preview
          path: app/build/outputs/apk/preview/app-preview.apk
          retention-days: 30
          if-no-files-found: error
