name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test and build debug APK
        run: gradle testDebugUnitTest testPreviewUnitTest assembleDebug assemblePreview --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: PixivDumpSync-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Verify distinct preview package
        run: |
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk | grep "package: name='com.azrael.pixivdumpsync'"
          "$AAPT" dump badging app/build/outputs/apk/preview/app-preview.apk | grep "package: name='com.azrael.pixivdumpsync.nocturne'"
          "$AAPT" dump badging app/build/outputs/apk/preview/app-preview.apk | grep "application-label:'Nocturne Preview'"

      - name: Upload independently installable Nocturne preview APK
        uses: actions/upload-artifact@v4
        with:
          name: Nocturne-Preview-v1.0.0-apk
          path: app/build/outputs/apk/preview/app-preview.apk
          if-no-files-found: error
