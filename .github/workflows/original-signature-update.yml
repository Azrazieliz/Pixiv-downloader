name: Kuroha Original-Signature Update APK

# Intentionally manual: this job must NEVER silently use GitHub's ephemeral
# debug keystore to produce an install-over-update artifact.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KUROHA_STORE_PASSWORD: ${{ secrets.KUROHA_STORE_PASSWORD }}
      KUROHA_KEY_ALIAS: ${{ secrets.KUROHA_KEY_ALIAS }}
      KUROHA_KEY_PASSWORD: ${{ secrets.KUROHA_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Stage user-owned original keystore and verify certificate
        shell: bash
        env:
          KUROHA_KEYSTORE_BASE64: ${{ secrets.KUROHA_ORIGINAL_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$KUROHA_KEYSTORE_BASE64" || -z "$KUROHA_STORE_PASSWORD" ||
                -z "$KUROHA_KEY_ALIAS" || -z "$KUROHA_KEY_PASSWORD" ]]; then
            echo "::error::Original signing keystore and alias/password secrets must be provisioned. No replacement debug key will be used."
            exit 1
          fi
          export KUROHA_ORIGINAL_KEYSTORE="$RUNNER_TEMP/kuroha-original-keystore"
          umask 077
          printf '%s' "$KUROHA_KEYSTORE_BASE64" | base64 --decode > "$KUROHA_ORIGINAL_KEYSTORE"
          if ! keytool -exportcert -keystore "$KUROHA_ORIGINAL_KEYSTORE" \
              -storepass "$KUROHA_STORE_PASSWORD" -alias "$KUROHA_KEY_ALIAS" \
              > "$RUNNER_TEMP/kuroha-original-cert.der"; then
            echo "::error::Unable to read the original signing key certificate"
            exit 1
          fi
          CERT_SHA="$(sha256sum "$RUNNER_TEMP/kuroha-original-cert.der" | cut -d ' ' -f 1)"
          EXPECTED="540e540f3c8fbc0c8bb1dad514f48799e80a74facd0a3f51371478d18143dec9"
          if [[ "$CERT_SHA" != "$EXPECTED" ]]; then
            echo "::error::Wrong certificate. This key cannot update the installed Kuroha v0.6.1 app."
            exit 1
          fi
          echo "Original v0.6.1 certificate matched."
          echo "KUROHA_ORIGINAL_KEYSTORE=$KUROHA_ORIGINAL_KEYSTORE" >> "$GITHUB_ENV"

      - name: Build original-signature Kuroha update APK
        run: gradle --no-daemon test assembleRelease --stacktrace

      - name: Verify APK signature before publishing
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$APK" ]]; then
            echo "::error::No signed APK produced"
            exit 1
          fi
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          "$APKSIGNER" verify --verbose "$APK"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)"
          EXPECTED="540e540f3c8fbc0c8bb1dad514f48799e80a74facd0a3f51371478d18143dec9"
          if [[ "${ACTUAL,,}" != "$EXPECTED" ]]; then
            echo "::error::Built APK does not carry the original Kuroha certificate."
            exit 1
          fi
          echo "Signed APK matches the installed v0.6.1 certificate."

      - name: Upload upgrade-compatible signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Kuroha-v0.7.0-original-signature-upgrade
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Remove sensitive keystore files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/kuroha-original-keystore" "$RUNNER_TEMP/kuroha-original-cert.der"
