name: Android 16 Runtime Smoke Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ "main" ]

jobs:
  launch-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug assemblePreview --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0660", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator and verify launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/preview/app-preview.apk
            adb shell pm list packages | grep '^package:com.azrael.pixivdumpsync$'
            adb shell pm list packages | grep '^package:com.azrael.pixivdumpsync.nocturne$'
            adb shell am start -W -n com.azrael.pixivdumpsync.nocturne/com.azrael.pixivdumpsync.DownloaderHubActivity
            sleep 3
            adb exec-out screencap -p > nocturne-preview-hub.png
            adb shell am start -W -n com.azrael.pixivdumpsync.nocturne/com.azrael.galleryflow.MainActivity
            sleep 3
            adb exec-out screencap -p > nocturne-gallery-ui.png
            adb shell am start -W -n com.azrael.pixivdumpsync.nocturne/com.asterion.videoflow.MainActivity
            sleep 3
            adb exec-out screencap -p > nocturne-videoflow-ui.png
            adb shell pidof -s com.azrael.pixivdumpsync.nocturne | grep -Eq '[0-9]+' || { echo "Preview did not launch"; exit 1; }
            adb logcat -c
            adb shell am force-stop com.azrael.pixivdumpsync
            adb shell am start -W -n com.azrael.pixivdumpsync/.DownloaderHubActivity
            sleep 4
            adb exec-out screencap -p > asterion-downloader-hub.png
            adb shell am start -W -n com.azrael.pixivdumpsync/com.asterion.videoflow.MainActivity
            sleep 3
            adb exec-out screencap -p > asterion-videoflow-ui.png
            echo "=== PID ==="
            adb shell pidof -s com.azrael.pixivdumpsync
            echo "=== CRASH BUFFER ==="
            adb logcat -b crash -d || true
            echo "=== APP LOGS ==="
            adb logcat -d | grep -E "pixivdumpsync|AndroidRuntime|FATAL EXCEPTION" || true
            adb shell pidof -s com.azrael.pixivdumpsync | grep -Eq '[0-9]+' || { echo "App process is not alive after launch"; exit 1; }

      - name: Upload launcher screenshot
        uses: actions/upload-artifact@v4
        with:
          name: asterion-downloader-hub-screenshot
          path: |
            asterion-downloader-hub.png
            nocturne-preview-hub.png
            nocturne-gallery-ui.png
            nocturne-videoflow-ui.png
            asterion-videoflow-ui.png
          if-no-files-found: warn
