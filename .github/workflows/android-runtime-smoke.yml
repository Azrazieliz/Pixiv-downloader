name: Android 16 Runtime Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  launch-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0660", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator and verify launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.azrael.pixivdumpsync
            adb shell am start -W -n com.azrael.pixivdumpsync/.MainActivity || true
            sleep 3
            echo "=== PID ==="
            PID="$(adb shell pidof -s com.azrael.pixivdumpsync | tr -d '\r')"
            echo "${PID:-<none>}"
            echo "=== CRASH BUFFER ==="
            adb logcat -b crash -d || true
            echo "=== APP LOGS ==="
            adb logcat -d | grep -E "pixivdumpsync|AndroidRuntime|FATAL EXCEPTION" || true
            if [ -z "$PID" ]; then
              echo "App process is not alive after launch."
              exit 1
            fi
